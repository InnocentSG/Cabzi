# =========================================
# APPLICATION
# =========================================

spring.application.name=ridesystem

server.port=8080


# =========================================
# MYSQL DATABASE
# =========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cabzi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================
# JPA / HIBERNATE
# =========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.open-in-view=false


# =========================================
# JWT
# =========================================

jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_IN_ENVIRONMENT}

jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================
# SEED USERS
# =========================================

seed.admin.email=${SEED_ADMIN_EMAIL:admin@cabzi.com}

seed.admin.password=${SEED_ADMIN_PASSWORD:CHANGE_ADMIN_PASSWORD}

seed.staff.email=${SEED_STAFF_EMAIL:staff@cabzi.com}

seed.staff.password=${SEED_STAFF_PASSWORD:CHANGE_STAFF_PASSWORD}


# =========================================
# FIREBASE CLOUD MESSAGING
# =========================================

firebase.enabled=${FIREBASE_ENABLED:false}

firebase.server-key=${FIREBASE_SERVER_KEY:}

firebase.fcm-url=${FIREBASE_FCM_URL:https://fcm.googleapis.com/fcm/send}


# =========================================
# FILE UPLOAD
# =========================================

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=20MB


# =========================================
# SWAGGER
# =========================================

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html


# =========================================
# JACKSON
# =========================================

spring.jackson.serialization.fail-on-empty-beans=false


# =========================================
# LOGGING
# =========================================

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE